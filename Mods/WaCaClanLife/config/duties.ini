; WaCa Clan Life - the clan loop (tickets.md 15) - EXPERIMENTAL, off by default
;
; The clan's day: the MORNING and the AFTERNOON (config name Noon) are duties - the deputy gives your cat a task -> you
; do it, exploring as long as you like (a done task never sends you home) -> you turn it in at its end point (a hunt:
; at the fresh-kill pile; a patrol: report to the deputy) -> the clan's event of that third, if any (clanevents.ini;
; the story's: days.ini) -> the next. The EVENING is no duty: the clan gathers - eating together, sharing tongues
; (clanevents.ini When = Evening, staged with the cats). Then the NIGHT: go to your den - your own or your rank's - and
; you sleep (or use a nest out in the open); or the night watch (go to the guard spot at the camp's entrance, a short
; cutscene shows the night passing). At the day's end the tasks done raise your
; standing in the clan, the missed ones lower it (kept with your save). Needs the day / night cycle (daynight.ini
; On = 1 - the loop moves its clock; DayMinutes no longer matter). Cards in the middle of the screen tell you each step.
;   [Duties] MaxRank: from this rank on your cat hands the tasks out instead of getting them (Apprentice, Warrior,
;            Deputy, Leader) - each duty third you give out the clan's tasks at its meeting place - next to your
;            leader in camp; the game shows "Interact" there. Your rank comes from your cat's name (-paw apprentice, -star leader),
;            the save telling a warrior from the deputy. DeputyName: how the cards name the deputy ({DEPUTY}). CampRadius: the camp's smallest
;            radius (cm) - it is around the clan's story cats (the deputy, the leader, the medicine cat ...) and grows
;            to hold the ones within CampMax (cm) of its middle (story cats out in the territory don't count).
;            ReportKey (F): a talk turn-in (Deputy / Partner / a role) also happens with this key next to that cat
;            (within ReportRadius cm) - for when the game offers no conversation.
;   [Thirds] Morning / Noon / Evening / Night: the hour the sky shows for each (the day turns at the morning).
;   [Tasks]  Morning / Noon / Night: the tasks each draws from, with weights - Hunt, Patrol, Train,
;            Free (nothing - the time is yours), and for the night Sleep, NightWatch (or any task: a night hunt).
;            PileFactor: hunting counts that many times when the fresh-kill pile is under PileLow.
;   [Hunt]   Min / Max: prey to catch (Max when the fresh-kill pile is under PileLow, of 100). PilePerPrey: what every
;            prey caught on a hunt adds to the clan's fresh-kill pile, the game's own way (more than asked for too).
;            HuntingGround = 1: a hunting ground with prey of the season is marked out in the territory.
;            (Catches count with hunting by chance: hunting.ini [Chance] On = 1.)
;   [Patrol] Points: border points to check, out in the territory (MinDistance / MaxDistance from you, cm); each is
;            marked like StarClan's guidance (sense mode shows the way). Reach: how close counts as checked.
;            Companions: clanmates who walk the patrol with you (the nearest ones; 0 = you go alone).
;   [Train]  On = 1: cats up to MaxRank can be sent to train - a sparring fight with the clan's move teacher (else the
;            nearest clanmate): go to them and the game's own fight starts; win or lose it counts, the bond grows by
;            Bond.
;   [Task.<Hunt|Patrol|Train|Free>] TurnIn: the task's end point - Pile (the catch onto the fresh-kill pile), Partner
;            (talk to the cat the task was with - training: your mentor, back in camp), a role (Deputy, Leader,
;            MedicineCat ...: report to that cat), None (done is the end).
;   [NightWatch] Standing: extra standing for keeping it; Step1, Step2 ...: its cutscene (scene steps, below).
;   [Standing] Done / Missed: standing per task done / missed.
;   [MeetingPlace] where each clan's leader calls its meetings from - {MEETINGPLACE} in any card. The lake
;            territories (this game): ThunderClan's Highledge (Highrock was the old forest's), RiverClan's Highstump
;            (a hawthorn stump in the clearing), WindClan's Tallrock; ShadowClan's leader stands on a fallen log (the
;            books' lake camp names no rock - Victoria Holmes); a clan not listed uses Default.
;   [Talk]   the deputy's own words while you talk to him (the game only has "nothing new for you" - its text Key is
;            swapped for the talk): Report (you have a task to report), Busy (your task is still under way). {TASK}
;            {TASKNAME} {THIRD} {DEPUTY} filled in.
;
; HOOK POINTS - scenes (steps, as in events.lua: Card: <text> / Dialogue: <id> @ <who> / Fade: <s> / FadeIn: <s> /
; Wait: <s> / Bond: <n> @ <who> / Emit: <event> / Hook: <name>; {DEPUTY} {TASK} {N} {THIRD} {DAY} {WHO} {RESTKEY}
; are filled in):
;   [Third.<Morning|Noon|Evening|Night>] Start1, Start2 ...: when the third begins; Event1, Event2 ...: at its end
;            (after the turn-in and the clan's events).
;   [Assign.<Hunt|Patrol|Train|Free|NightWatch|Sleep>] Step1, Step2 ...: how the deputy gives that task (e.g. a
;            Dialogue with the deputy instead of a card).
; More: clanevents.ini (the clan's events), days.ini (the story's beats per story day), and in Lua the blocking hooks
; ClanThirdStart / ClanAssign / ClanThirdEnd / ClanNight (Events.Hook) and the WaCa events ClanThird, TaskAssigned,
; TaskDone, TaskTurnedIn, ClanThirdEnded, CampEntered / CampLeft, ClanNight, DutiesJudged.

[Duties]
On = 0
MaxRank = Deputy
DeputyName = The deputy
CampRadius = 3500
CampMax = 6000
;   (keybinds.ini [ModKeys] ClanLife.Report wins when WaCa Keybinds & Mouse is installed: every key in one file)
ReportKey = F
ReportRadius = 500

[Thirds]
Morning = 8
Noon = 13
Evening = 19
Night = 23

[Tasks]
Morning = Hunt:2, Patrol:2, Train:1, Gather:1, Bedding:1
Noon = Train:2, Hunt:1, Patrol:1, Gather:1, Water:1
Night = Sleep:3, NightWatch:1
PileFactor = 3
; a task the cat just had is less likely next: its chance x RepeatFactor for each time in that third's last
; RepeatMemory picks, and once more if it was the third right before (a story day's <Third>Duties / <Third>Duty in
; days.ini sets the day's own chances / task)
RepeatFactor = 0.35
RepeatMemory = 2

[Assign.Hunt]
Step1 = Card: {DEPUTY}: The fresh-kill pile needs filling - bring back {N} prey.

[Assign.Patrol]
Step1 = Card: {DEPUTY}: Patrol the border - check the {N} marked points.

[Assign.Train]
Step1 = Card: {DEPUTY}: Go and train - {WHO} is waiting for you.

[Assign.Free]
Step1 = Card: {DEPUTY}: Nothing for you this {THIRD} - the time is yours.

[Assign.NightWatch]
Step1 = Card: {DEPUTY}: You keep watch tonight - take your place at the camp's entrance.

[Assign.Sleep]
Step1 = Card: Night falls. Go to your den to sleep.

[Task.Hunt]
TurnIn = Pile

[Task.Patrol]
TurnIn = Deputy

[Task.Free]
TurnIn = Deputy

[Task.Train]
TurnIn = Partner

[NightWatch]
Standing = 1
Step1 = Fade: 2
Step2 = Card: You keep watch over the sleeping camp until dawn.
Step3 = Wait: 2

[Hunt]
Min = 1
Max = 3
PileLow = 50
HuntingGround = 1
PilePerPrey = 4

; [Gather] - apprentices gather for the medicine cat: Count of the game's own pickups out in the territory (moss
; where the world has it, else herbs - healing herbs, catnip), each marked like a border point and gathered by
; reaching it (Reach cm; MinDistance cm from where the task is given); turned in to the medicine cat
; ([Task.Gather] TurnIn). Given only up to MaxRank (the [Tasks] weights decide how often).
; The same MaxRank gives the other apprentice duty, Bedding: take the old moss out of one of your clan's dens
; (walk in) and throw it out of camp (a marked spot) - turned in to the deputy.
; And Water: soak moss at the nearest water (the game's fishing spots, marked) and bring it to the elders - three
; times as likely in Greenleaf.
[Gather]
Count = 3
Reach = 250
MinDistance = 1500
MaxRank = Apprentice

[Patrol]
Points = 2
MinDistance = 3000
MaxDistance = 12000
Reach = 800
Companions = 2

[Train]
On = 1
MaxRank = Apprentice
Bond = 2

[Standing]
Done = 2
Missed = -1

[MeetingPlace]
ThunderClan = the Highledge
RiverClan = the Highstump
WindClan = the Tallrock
ShadowClan = the fallen log
Default = the leader's rock

[Talk]
Key = STR_DIALOGUE_NOTHING_CONTEXT_1
Report = Good work. The clan is better for it - rest a while.
Busy = Shouldn't you be out on your {TASKNAME}? The clan is counting on you.
