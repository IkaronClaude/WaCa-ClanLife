; WaCa Clan Life - kits of your own (the groundwork for romance + kits: who becomes a mate, the asking, when kits
; come and how they grow up are a story's to decide). A story or another mod has kits born with
; WaCa.Emit("HaveKits", "<the mate's name>"[, count]); each kit's look is blended from its parents' (each trait from one
; of them), kit-sized, with a name of its own. They live by your clan's nursery (the game's own den) and are kept
; with the save. Event KitsBorn(mate, names) for stories.
[Kits]
On = 1
; how many in a litter: a number or a range (1-3)
Count = 1-3
; how far in front of the nursery's door they sit (cm)
Spread = 160
