; WaCa Clan Life - the ties between your clan's cats (the evening's groups: events.lua "Groups: Tongues | Prey").
; Cats by their name as the game shows it (Hollybranch, Cloudsong ...). Each line: a cat = the cats it is tied to,
; comma-separated; a tie works both ways. The game rolls its camp cats' names anew at every load; Clan Life keeps the
; name each one first had per save (WrcGame.<slot>.WaCaCampCats.ini), so their names - and ties - stay.
;   [Mates]     sit together first; the leader sits only with its mate and / or the deputy
;   [Friends]   like to sit together
;   [Tensions]  never share a group (a story beat can add one here)
; What carries meaning is fixed; chance only picks where it doesn't matter, and the story has a lever everywhere:
;   the leader always sits with its mate(s) and the deputy - unless a story event (Set: LeaderAway = 1 - ill, away:
;   the leader sits nowhere; Set: DeputyAway = 1); queens with their kits; mates and [Pairs] together; then each role
;   together - apprentices with apprentices, elders, warriors - in 3s and 2s (never one alone), WHO with whom by chance;
;   [Tensions] never together. Story steps (clanevents.ini / days.ini): Pair: A & B (together from now on), Part: A & B
;   (never together), kept with the save; Set: Pair:A & B = 0 lifts one. Sharing prey: now and then a group of 4
;   (events.ini BigPreyChance); Set: BigPrey = 1 forces it, Set: NoBigPrey = 1 rules it out.
;   [Pairs]     always sit together (the story wants them side by side)
; Other mods can add their own config/relations.ini - the sections add up.

