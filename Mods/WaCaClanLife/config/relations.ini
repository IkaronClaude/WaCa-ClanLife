; WaCa Clan Life - the ties between your clan's cats (the evening's groups: events.lua "Groups: Tongues | Prey").
; Cats by their name as the game shows it (Hollybranch, Cloudsong ...). Each line: a cat = the cats it is tied to,
; comma-separated; a tie works both ways. The game rolls its camp cats' names anew at every load; Clan Life keeps the
; name each one first had per save (WrcGame.<slot>.WaCaCampCats.ini), so their names - and ties - stay.
;   [Mates]     sit together first; the leader sits only with its mate and / or the deputy
;   [Friends]   like to sit together
;   [Tensions]  never share a group (a story beat can add one here)
; Without ties: apprentices sit with apprentices, elders with elders, warriors with warriors, kits with queens.
; Other mods can add their own config/relations.ini - the sections add up.

