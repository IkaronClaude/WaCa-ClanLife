; WaCa Clan Life - romance, A DRAFT (tickets.md 12: who can be a mate, the asking and when kits come are yours to
; decide - this is one way, every rule below). Off by default.
; Next to a story cat your cat has grown close to, the ask key asks it to be your cat's mate. Close = the game's own bond
; with that cat (the bond rewards it gives: Neutral, Friendly, Friend, CloseBond) at MinBond or above; your cat of
; MinRank or above, no mate yet. Yes: kept with the save (event MateChosen; story variable HasMate = 1); KitsAfter days
; later the kits come (kits.ini). {NAME} = the cat asked, {PLAYER} = your cat.
[Romance]
On = 0
AskKey = H
Radius = 400
MinBond = CloseBond
MinRank = Warrior
KitsAfter = 7
Yes = {NAME}: I was hoping you'd ask, {PLAYER}. Yes.
NotClose = {NAME} looks at you kindly - but you aren't that close yet.
TooYoung = You're too young to take a mate.
