; WaCa Clan Life - scenes at given times (tickets.md 17 + 10: "show, don't tell") - EXPERIMENTAL, off by default
;
; Things happen on screen at a time of day, instead of being told about later. Needs the day / night cycle
; (daynight.ini On = 1) - it counts the hours and days. One section per scene:
;   [Event.<Name>]
;   Hour: the hour it happens (0-23).
;   Day: the day it happens (the save's day count, 1 = the first); with Every: the first day of a repeat.
;   Every: repeat every N days (no Day / Every = every day).
;   Once = 1: only once per save (remembered with the save).
;   Card: a text shown in the middle of the screen ({DAY} = the day number); CardSeconds: how long.
;   Dialogue: one of the game's own scripted conversations, with the clanmate nearest to your cat - the ids are
;     listed in events-dialogues.txt (written next to this file the first time you're in the world with this on).
;
; [Cast] - your own roles (a story pack's content\events.ini, no code): S:<role> = who plays it - a cat's name as the
;   game shows it (a WaCa Looks roster cat's Name too), a part of your clan (Leader, Deputy, MedicineCat) or E:<story
;   role>. Scenes and cutscenes then ask for "S:<role>" (Bond: 2 @ S:herbalist, a cutscene's P = Player, S:herbalist).
;   Example: S:herbalist = Mossfeather
; A role may also be played by a cat who isn't in the world: S:loner = Rogue:Quill (a rogue / loner, named) or
;   = Clan:ShadowClan[.<Part>] - WaCa Cutscenes brings it in for each scene that asks for it.

[Events]
On = 0
; the clan's staged scenes (clanevents.ini Groups steps): WalkIn = 1 - the cats walk to their seats (set down WalkFrom
; units out, at WalkSpeed - the camp cats amble at 50 -, WalkSeconds at most, then seated where they are); 0 - they're
; simply there after the fade.
WalkIn = 1
WalkFrom = 700
WalkSeconds = 12
WalkSpeed = 150
; sharing prey: the chance (percent) of one group of 4 round a big piece (story vars BigPrey / NoBigPrey force it)
BigPreyChance = 25

; examples - edit or remove
[Event.Dawn]
Hour = 6
Card = Dawn breaks over the camp.

[Event.Gathering]
Day = 7
Every = 28
Hour = 20
Card = The full moon rises - the Gathering is tonight.
