; WaCa Clan Life - STORY PACK STARTS: where a NEW cat's story begins. Nothing here by default - a story pack sets it in
; its own content/start.ini (the same [Start] section), e.g. a warrior start:
;
; [Start]
; Day = 13          the story day (days.ini) a new cat starts on
; Level = 8         its level - reached through the game's own EXP, one level-up after another
; Name = Warrior    the creator asks for a warrior name (WaCa Looks)
; Step1 = Card: Your first day as a warrior.        scene steps run once at the start (as in clanevents.ini)
;
; Applied once, to a new cat only (level 1, no rank quest done): a cat already being played is never changed.
; Not yet possible: a start rank and a start party (both live in the game's native quest data).
