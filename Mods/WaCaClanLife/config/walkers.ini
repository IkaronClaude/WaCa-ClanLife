; WaCa Clan Life - the camp's walking cats are its named cats (walkers.lua)
;
; The game walks a few nameless cats round each camp. With this on, each third of the clan's day those walkers wear
; the camp's named cats in turn - the cat's look and name - while that cat's placed self is hidden (nobody twice in
; camp). Whose turn: the ones that walked longest ago first. Never the key cats: story characters, the leader, deputy,
; medicine cat, the clan's services (gossip, fresh-kill, the move teacher, side quests, skirmish, races, deliveries),
; queens and kits, StarClan - only plain warriors, elders, apprentices and the camp's unnamed-part cats.
;   On = 1: on.
;   Never: names of cats that never walk (comma-separated).
; The story's lever: the story variable Walk:<Name> - 1 that cat walks at the next turn, -1 it never walks
; (Set: Walk:Larkpelt = 1 in a scene; other mods: WaCa.Emit("SetStoryVar", name, value)).

[Walkers]
