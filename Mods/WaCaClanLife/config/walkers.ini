; WaCa Clan Life - the camp's named cats move about (walkers.lua)
;
; The game walks a few nameless cats round each camp; with this on they're taken out, and the camp's NAMED cats move
; instead - in turns, each third of the day a few of them, the ones that moved longest ago first:
;   roamers (plain warriors, apprentices, elders, cats with no story part) go across camp - to a den's front, the
;     fresh-kill pile, the meeting place, another cat's spot - stay a while, and come home;
;   homebodies (every cat with a part: the trainer, the medicine cat, gossip, fresh-kill, the leader, the deputy,
;     queens, kits, story cats) stay close - over to a nearby spot, a while, back.
; They walk with the game's own walk animation; nobody moves while you talk to someone or a menu / scene is up. In the
; evening's scenes (clanevents.ini Groups) the named cats walk to their seats and home again afterwards.
;   On = 1: on.  Roamers / Homebodies: how many move each turn.  Speed: walking speed (cm/s).
;   Never: names of cats that never move (comma-separated).
; The story's lever: the story variable Walk:<Name> - 1 that cat moves at the next turn, -1 it never moves
; (Set: Walk:Larkpelt = 1 in a scene; other mods: WaCa.Emit("SetStoryVar", name, value)).
; Trace = 1 (diagnostic): every engine call walkers makes is written, flushed, to Wrc/Saved/walkers_trace.txt.

[Walkers]
On = 0
Roamers = 3
Homebodies = 2
Speed = 110
