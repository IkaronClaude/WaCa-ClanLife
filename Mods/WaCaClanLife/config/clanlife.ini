; WaCa Clan Life - one switch for the clan's life
;
; On = 1 turns on every part listed in Parts, whatever that part's own file says - the quick way to play with the
; clan's daily life. Each part's settings stay in its own file (daynight.ini, duties.ini ...). Parts not listed here
; (or everything, with On = 0) follow the On of their own file.
;
; The parts:
;   DayNight   the day / night cycle (daynight.ini) - the clan's day needs it
;   Weather    seasons and weather, prey by season (weather.ini)
;   TimeSkip   resting with the rest key: the night passes (timeskip.ini)
;   Exhaustion pounces and fights tire your cat, sleep resets it (exhaustion.ini)
;   Duties     the clan loop: the deputy's tasks, turn-ins, clan events, the night (duties.ini, clanevents.ini)
;   Patrols    the clan's own patrols heading out together (patrols.ini)
;   Gatherings the leader picks who goes to the Gathering (gatherings.ini)
;   Walkers    the camp's walking cats are its named cats, in turns (walkers.ini)
;   Lines      more for clan cats to say (lines.ini) - its example lines are placeholders
;   Days       the story as days (days.ini) - its example days are placeholders
;   Ambient    clanmates sit, nap and play in camp (activities.ini [Ambient])
;   Join       spend time with a story cat - G (activities.ini [Join])

[ClanLife]
On = 0
Parts = DayNight, Weather, TimeSkip, Exhaustion, Duties, Patrols, Gatherings, Walkers

[Hud]
; the day at a glance while the clan loop runs: a panel like the game's own quest objective (left side of the HUD) -
; the time of day, your task, where to go and how far along you are. It sits under the game's own quest panel:
; Below / Right move it from there (the HUD's layout units: 3840 x 2160).
On = 1
Below = 760
Right = 0
