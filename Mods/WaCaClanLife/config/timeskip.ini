; WaCa Clan Life - intentional time skips (tickets.md 20) - EXPERIMENTAL, off by default
;
; Time passes on purpose and on screen: resting skips to a new morning, and the days you skip move the season, the
; weather and the prey on (weather.ini). Needs the day / night cycle (daynight.ini On = 1) - it counts the days.
;   RestKey: a key that makes your cat rest (empty, the default = no key: with the clan loop your cat sleeps in its
;     nest - duties.ini; other mods / day scripts can still skip). F9 was the old default.
;   RestDays: how many days one rest skips (1 = to the next morning; 7 = a quarter moon).
;   WakeHour: the hour the new day starts at (empty = daynight.ini StartHour).
;   Card: the text shown when time passes - {DAYS} ("A day", "A quarter moon", "A moon", "3 days"), {PASS} ("passes" /
;     "pass" to match), {SEASON},
;     {WEATHER}, {DAY} (the day number). CardSeconds: how long it shows.

[TimeSkip]
On = 0
; (keybinds.ini [ModKeys] ClanLife.Rest wins when WaCa Keybinds & Mouse is installed)
RestKey =
RestDays = 1
WakeHour =
Card = {DAYS} {PASS}. It is {SEASON}.
CardSeconds = 6
; Fade: the world fades to black for the card(s) and back (seconds; 0 = the card over the world, as before).
; Summary = 1: a second card says what the skip changed - the season, the weather, how far the stories moved.
Fade = 1.5
Summary = 1
