; WaCa Clan Life - the clan's events (the clan loop, duties.ini) - what happens at a third's end, after the task's turn-in
;
; One [Event.<Name>] per event:
;   When: Morning | Noon | Evening | Night - the third it belongs to (it plays at the third's end, after the task's
;     turn-in). Or Reach: <place> - when your cat comes within Radius (cm, 800) of a place: one of WaCa Cutscenes'
;     places.ini (a pack's too - Reach: ReedBank), Pile, x y z, or a CAT (Reach: S:storyteller / Leader / a name - where
;     it is now: "when your cat meets her"); once a day at most (Once = 1: once a save), never
;     over a menu or a cutscene.
;   Chance: % (100 = every time). The story's lever: the story variable Event:<Name> - 1 it happens, -1 it doesn't
;     (Set: Event:ClanMeeting = 1 in a scene; other mods: WaCa.Emit("SetStoryVar", name, value)) - or a story day's
;     Events = A, B / NoEvents = A, B (days.ini).
;   Day / Every: from story day Day on (the day / night cycle's day count), every Every days; OnlyDay: that day only.
;   Once = 1: only once per save.
;   Order: where it plays among the third's end scenes (lowest first): the story's beats 100, clan events 200 (the
;     default), the story's after-beats 300, duties.ini [Third.X] Event 350, the ClanThirdEnd hook 400.
;   Require: conditions on story variables, e.g. Require = LeaderFavour >= 5, Rank >= 2 (events.lua; unset = 0).
;   Step1, Step2 ...: the scene - Card: <text> / Gather: <n> [@ Here|Pile] (clanmates come and stand facing you - an
;     audience) / Groups: Tongues|Prey (the clan in small groups by their ties, config/relations.ini: tongues in 2s and
;     3s, prey in 2s, 3s and now and then a 4; your cat joins one) / Pair: A & B, Part: A & B (the story's levers on
;     who sits with whom - relations.ini) /
;     Pose: <Sit|Lie|Sleep|Eat|Sniff|Meow|Play|Groom> [@ Gathered|Player|All|<who>] (the game's animations) / Release (they
;     go back to their lives) / Dialogue: <id> @ <who> (the game's own conversations and cinematics:
;     events-dialogues.txt; <who>: Deputy, Leader, MedicineCat, Teacher, Nearest or a story role) / Fade: <s> /
;     FadeIn: <s> / Wait: <s> / Bond: <points> @ <who> / Emit: <event> (Lua: WaCa.On) / Set: <var> = <value> /
;     Add: <var> <n> / If: <conditions> (the rest only if they hold) / Cutscene: <Name> (a WaCa Cutscenes
;     cutscene - its [Cutscene.<Name>]; the scene waits for it) / Hook: <name> (Lua: Events.Hook(name,
;     fn(ctx, continue)) - a mod's own code goes here) / Lead: <place> @ <who> (the cat walks your cat there:
;     comes to you first, waits when you fall behind; places Den:<the game's den name>, Zone:<code>, Pile, a cat's
;     name; the scene goes on when it's there).
; Several events can come in one third (in name order). The story's beats for a day come first (days.ini).
; (The Gathering is its own feature: gatherings.ini.)

[Event.ShareTongues]
; the evening: the clan comes together around your cat - they eat, settle down and share tongues
When = Evening
Chance = 100
Step1 = Groups: Prey
Step2 = Pose: Eat @ All
Step3 = Card: The clan shares out the fresh-kill.
Step4 = Groups: Tongues
Step5 = Pose: Sit @ All
Step6 = Card: You share tongues with your clanmates.
Step7 = Bond: 1 @ Nearest
Step8 = Wait: 3
Step9 = Release

[Event.ClanMeeting]
When = Morning
Chance = 15
Step1 = Card: "Let all cats old enough to catch their own prey gather beneath {MEETINGPLACE} for a Clan meeting!"
