; WaCa Clan Life - more for clan cats to say (tickets.md 11) - EXPERIMENTAL, off by default
;
; The game gives each cat role ONE line per story chapter, so clan cats repeat themselves. Add lines here: every
; in-game hour each cat's line is, by chance (Share), one of these for the time of day - or the game's own again.
;   [Lines.<Role>]: lines for one role - the game's role names (TheAgingLeader, RiverClanQueen, ThunderClanWarrior,
;     Brightheart ...: the part after "Filler." in its QST_Story.Monologue.Filler.* text ids); [Lines.All]: every cat.
;   Keys: Morning (5-11), Day (11-17), Evening (17-21), Night (21-5), Any (any time) - numbered for more than one
;     (Morning1, Morning2 ...). {PLAYER} and the other name placeholders work as in the game's own lines.
; Needs the day / night cycle (daynight.ini On = 1) for the time of day; without it the Day lines are used.

[Lines]
On = 0
Share = 0.5

; examples - edit freely
[Lines.All]
Morning1 = The dawn patrol is back already? I'm still waking up.
Morning2 = The dew is heavy this morning - mind your paws.
Day1 = The sun's warm on the rocks. Even the elders are out.
Evening1 = The hunting patrols should be back soon. I'm starving.
Night1 = Keep your voice down, the kits are sleeping.
Night2 = Look at Silverpelt tonight. StarClan is watching over us.
Any1 = Have you eaten? The fresh-kill pile won't last long.

; [Hunt] - a clanmate comments on your hunt: after a catch / a missed pounce (WaCa Hunting) a party mate (the game's
; party, or the cats following you) within Radius cm says one of these, by Chance % - with nobody in your party the
; nearest clanmate does (Who = Party: party mates only). {PLAYER} = your cat's name, {PREY} = mouse, rabbit ... The line
; shows as WaCa Cutscenes' subtitle. On = 0: no comments. (Works without [Lines] On.)
[Hunt]
On = 1
Radius = 1500
Chance = 100
Who = Nearest
Caught1 = Nice catch, {PLAYER}!
Caught2 = That {PREY} never saw you coming.
Caught3 = The elders will eat well tonight.
Missed1 = So close! It was too quick.
Missed2 = Keep your weight back next time, {PLAYER}.
Missed3 = Don't worry - there's more prey in the forest.
