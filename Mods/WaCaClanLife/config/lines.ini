; WaCa Clan Life - more for clan cats to say (tickets.md 11) - EXPERIMENTAL, off by default
;
; The game gives each cat role ONE line per story chapter, so clan cats repeat themselves. Add lines here: every
; in-game hour each cat's line is, by chance (Share), one of these for the time of day - or the game's own again.
;   [Lines.<Role>]: lines for one role - the game's role names (TheAgingLeader, RiverClanQueen, ThunderClanWarrior,
;     Brightheart ...: the part after "Filler." in its QST_Story.Monologue.Filler.* text ids); [Lines.All]: every cat.
;   Keys: Morning (5-11), Day (11-17), Evening (17-21), Night (21-5), Any (any time) - numbered for more than one
;     (Morning1, Morning2 ...). {PLAYER} and the other name placeholders work as in the game's own lines.
; Needs the day / night cycle (daynight.ini On = 1) for the time of day; without it the Day lines are used.

[Lines]
On = 0
Share = 0.5

; examples - edit freely
[Lines.All]
Morning1 = The dawn patrol is back already? I'm still waking up.
Morning2 = The dew is heavy this morning - mind your paws.
Day1 = The sun's warm on the rocks. Even the elders are out.
Evening1 = The hunting patrols should be back soon. I'm starving.
Night1 = Keep your voice down, the kits are sleeping.
Night2 = Look at Silverpelt tonight. StarClan is watching over us.
Any1 = Have you eaten? The fresh-kill pile won't last long.

; [Hunt] - a clanmate comments on your hunt: after a catch / a missed pounce (WaCa Hunting) a party mate (the game's
; party, or the cats following you) within Radius cm says one of these, by Chance % - with nobody in your party the
; nearest clanmate does (Who = Party: party mates only). {PLAYER} = your cat's name, {PREY} = mouse, rabbit ... The line
; shows as WaCa Cutscenes' subtitle. On = 0: no comments. (Works without [Lines] On.)
[Hunt]
On = 1
Radius = 1500
Chance = 100
Who = Nearest
Caught1 = Nice catch, {PLAYER}!
Caught2 = That {PREY} never saw you coming.
Caught3 = The elders will eat well tonight.
Missed1 = So close! It was too quick.
Missed2 = Keep your weight back next time, {PLAYER}.
Missed3 = Don't worry - there's more prey in the forest.

; [Murmurs] - what the clan thinks, every day: walk past a camp cat and now and then (Chance %, once per cat per day)
; it murmurs a line - from every [Murmur.<Name>] whose Require holds (story conditions: Standing (your standing with
; the clan), Pile (the fresh-kill pile, 0-100), Season, Weather, Day, Rank, Gathering.Today, any story variable such as
; LeaderFavour) and whose Who fits the cat (its story role's ending: Elder, Warrior, Apprentice, Queen ...; All by
; default), a new one each day (no repeat until all have come). {PLAYER}, {LEADER}, {DEPUTY}, {NAME}. A story pack adds
; its own sets in content\lines.ini.
[Murmurs]
On = 1
Radius = 450
Chance = 35

[Murmur.Everyday]
Line1 = Did you see the clouds over the river this morning?
Line2 = I could do with a quiet day by the reeds.
Line3 = {LEADER} has been up since dawn again.
Line4 = My paws ache - too many patrols this moon.

[Murmur.TrustYou]
Require = Standing >= 2
Line1 = {PLAYER} has been working hard. The clan notices.
Line2 = If {PLAYER} says it's done, it's done.
Line3 = {DEPUTY} speaks well of {PLAYER} these days.

[Murmur.DoubtYou]
Require = Standing <= -2
Line1 = Where was {PLAYER} when the patrols left?
Line2 = Some cats only work when {LEADER} is watching.
Line3 = I hope {PLAYER} pulls their weight soon.

[Murmur.Hungry]
Require = Pile < 30
Line1 = The fresh-kill pile is almost empty. Again.
Line2 = I haven't eaten since yesterday.
Line3 = We need more hunters out, not more talk.

[Murmur.WellFed]
Require = Pile >= 80
Line1 = What a pile! StarClan is kind this moon.
Line2 = The kits will sleep with full bellies tonight.

[Murmur.LeafBare]
Require = Season = Leaf-bare
Line1 = The cold gets into my bones in leaf-bare.
Line2 = Ice on the river - the fish are deep and slow.
Line3 = Stay close to the camp when the snow comes.

[Murmur.Greenleaf]
Require = Season = Greenleaf
Line1 = Warm days and fat prey - I love greenleaf.
Line2 = The elders need water more in this heat.

[Murmur.Rain]
Require = Weather = Rain
Line1 = Rain again. At least the river is full.
Line2 = Wet fur and muddy paws - perfect.

[Murmur.GatheringDay]
Require = Gathering.Today = 1
Line1 = Who do you think {LEADER} will take to the Gathering?
Line2 = I hope there's no trouble with the other Clans tonight.

[Murmur.LeaderLoved]
Require = LeaderFavour >= 3
Line1 = {LEADER} is the best leader this Clan has had in moons.
Line2 = I'd follow {LEADER} anywhere.

[Murmur.LeaderDoubted]
Require = LeaderFavour <= -3
Line1 = I don't know what {LEADER} was thinking.
Line2 = Not every cat agrees with {LEADER}'s choices - not every cat says so, either.

[Murmur.Elders]
Who = Elder
Line1 = In my day, apprentices brought us fresh moss without being asked.
Line2 = These old bones remember a harder leaf-bare than this one.

; [PatrolMeet] - meet one of the clan's patrols out there: it stops a moment and each cat says a line, in turn: the
; leader one of these, the others one of [PatrolMeet.Member]. A cat's own lines: [PatrolMeet.<Name>]; the others' lines
; when a given cat leads: [PatrolMeet.LedBy.<Name>]. No line for a cat = it stays quiet. ({PLAYER}, {LEADER})
[PatrolMeet]
Line1 = {PLAYER}! All quiet along the border so far.
Line2 = We're marking the border - keep your eyes open.
Line3 = Smelled ShadowClan near the stream. Stay sharp, {PLAYER}.

[PatrolMeet.Member]
Line1 = Hello, {PLAYER}.
Line2 = Nothing to report yet.
Line3 = {LEADER} wants the whole border marked before sunhigh.
