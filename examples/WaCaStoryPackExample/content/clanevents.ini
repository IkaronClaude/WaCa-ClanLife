; A clan event that plays the cutscene: some mornings, once the morning's duty is turned in.
[Event.HerbLesson]
When = Morning
Chance = 40
Step1 = Cutscene: HerbLesson
Step2 = Bond: 2 @ S:herbalist

; Now and then of an evening the herbalist leads a ceremony - the game's own, re-cast - and your bond grows after it.
[Event.HerbalistsHonour]
When = Evening
Chance = 10
Step1 = Cutscene: HerbalistsHonour
Step2 = Bond: 2 @ S:herbalist

; When your cat falls through thin ice (WaCa Clan Life's ice: the FellThroughIce event), a clanmate pulls it out.
[Event.IceRescue]
When = Event:FellThroughIce
Step1 = Cutscene: IceRescue
Step2 = Card: Soaked and shivering, your cat makes it back to the bank.

; A SIDE THREAD over several days, missable: one morning a kit is gone; bring a catch home within two days and it
; follows the smell back - else a patrol finds it, and the chance is gone. (Story variables: LostKit 1 = missing,
; 2 = you found it, -1 = missed; LostKit.Until = the last day - "Set: X = Day + 2", conditions naming a variable.)
[Event.LostKitStart]
When = Morning
Day = 3
Chance = 30
Once = 1
Require = LostKit = 0
Step1 = Card: Mosskit has wandered off! A fresh catch might lure her home - before two dawns pass.
Step2 = Set: LostKit = 1
Step3 = Set: LostKit.Until = Day + 2

[Event.LostKitFound]
When = Event:HuntCaught
Require = LostKit = 1, Day <= LostKit.Until
Step1 = Card: The smell of your catch draws Mosskit out of the ferns - she follows you home.
Step2 = Set: LostKit = 2

[Event.LostKitMissed]
When = Evening
Require = LostKit = 1, Day > LostKit.Until
Step1 = Card: A patrol found Mosskit by the border - cold, but alive. You weren't the one to bring her home.
Step2 = Set: LostKit = -1
