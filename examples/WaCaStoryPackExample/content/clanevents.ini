; A clan event that plays the cutscene: some mornings, once the morning's duty is turned in.
[Event.HerbLesson]
When = Morning
Chance = 40
Step1 = Cutscene: HerbLesson
Step2 = Bond: 2 @ S:herbalist

; Now and then of an evening the herbalist leads a ceremony - the game's own, re-cast - and your bond grows after it.
[Event.HerbalistsHonour]
When = Evening
Chance = 10
Step1 = Cutscene: HerbalistsHonour
Step2 = Bond: 2 @ S:herbalist

; When your cat falls through thin ice (WaCa Clan Life's ice: the FellThroughIce event), a clanmate pulls it out.
[Event.IceRescue]
When = Event:FellThroughIce
Step1 = Cutscene: IceRescue
Step2 = Card: Soaked and shivering, your cat makes it back to the bank.

; A SIDE THREAD over several days, missable: one morning a kit is gone; bring a catch home within two days and it
; follows the smell back - else a patrol finds it, and the chance is gone. (Story variables: LostKit 1 = missing,
; 2 = you found it, -1 = missed; LostKit.Until = the last day - "Set: X = Day + 2", conditions naming a variable.)
[Event.LostKitStart]
When = Morning
Day = 3
Chance = 30
Once = 1
Require = LostKit = 0
Step1 = Card: Mosskit has wandered off! A fresh catch might lure her home - before two dawns pass.
Step2 = Set: LostKit = 1
Step3 = Set: LostKit.Until = Day + 2

[Event.LostKitFound]
When = Event:HuntCaught
Require = LostKit = 1, Day <= LostKit.Until
Step1 = Card: The smell of your catch draws Mosskit out of the ferns - she follows you home.
Step2 = Set: LostKit = 2

[Event.LostKitMissed]
When = Evening
Require = LostKit = 1, Day > LostKit.Until
Step1 = Card: A patrol found Mosskit by the border - cold, but alive. You weren't the one to bring her home.
Step2 = Set: LostKit = -1

; A loner asks for shelter one evening (the cutscene LonerVisit; its cat brought in for the scene) - and the clan
; talks about it for days after (lines.ini murmurs: SawLoner).
[Event.LonerVisit]
When = Evening
Chance = 25
Once = 1
Step1 = Cutscene: LonerVisit
Step2 = Set: SawLoner = 1
; (the player decides - Choice: <variable> = <question>; <answers> - and the scene goes the chosen way: If / Else / EndIf)
Step3 = Choice: ShelterQuill = Lionstar looks to you. Should Quill stay the night?; Let him rest by the border; Send him on his way
Step4 = If: ShelterQuill = 1
Step5 = Card: Quill curls up beside the border stones. At dawn he is gone - and a fat vole lies where he slept.
Step6 = Add: LeaderFavour 1
Step7 = Else
Step8 = Card: Quill dips his head and limps off into the dusk. Lionstar watches him go without a word.
Step9 = EndIf

; A cat LEADS your cat somewhere - it walks ahead, waits when you fall behind, goes on when you catch up; the scene
; goes on when it's there (Lead: <place> @ <who> - places: Den:<the game's den name>, Zone:<code>, Pile, a cat's name).
; Here: the deputy shows your cat the apprentices' den. Played when something asks for it (WaCa.Emit("ClanEvent",
; "MentorTour") - a story's rank-up, a day's beat).
[Event.MentorTour]
When = Event:MentorTour
Step1 = Card: Come with me - I'll show you where the apprentices sleep.
Step2 = Lead: Den:Apprentice's den @ Deputy
Step3 = Card: Here it is. Get some rest - training starts at dawn.

; WHO FIGHTS BESIDE YOUR CAT: a scene changes the party (Party: <story cats> - names, E:<role>; Party: none = the
; game's own). Kept with the save. Here: Toadfrost offers to fight beside you. WaCa.Emit("ClanEvent", "FightBeside").
[Event.FightBeside]
When = Event:FightBeside
Step1 = Cutscene: FightBeside
Step2 = Party: Toadfrost

; THE HERB COUNCIL: a five-cat cutscene, then the pack's own herbalist leads your cat to the medicine den and the
; story remembers it. Late in greenleaf / leaf-fall evenings, once. A mod (or the test) can run it:
; WaCa.Emit("ClanEvent", "HerbCouncil").
[Event.HerbCouncil]
When = Evening
Chance = 15
Once = 1
Require = HerbCouncil = 0
Step1 = Cutscene: HerbCouncil
Step2 = Lead: Den:Medicine Cat's den @ S:herbalist
Step3 = Card: Mossfeather shows you the drying stones. Catmint grows by the old Twoleg nest.
Step4 = Bond: 3 @ S:herbalist
Step5 = Set: HerbCouncil = 1
Step6 = Emit: SetSpecialisation = Herbalist
Step7 = Card: You will learn the herbs at Mossfeather's side - patient at the river, gentler in a fight.

; SHARING TONGUES: the clan sits in small groups by their ties (Groups: Tongues) - and the story pairs the herbalist
; with the deputy from now on (Pair: A & B, kept with the save; Part: A & B keeps two apart). Release lets them go.
; WaCa.Emit("ClanEvent", "HerbalistTongues").
[Event.HerbalistTongues]
When = Evening
Chance = 10
Require = HerbCouncil >= 1
Step1 = Pair: Mossfeather & Otterfeather
Step2 = Groups: Tongues
Step3 = Pose: Groom @ All
Step4 = Wait: 12
Step5 = Card: Mossfeather and Otterfeather talk quietly of catmint and frost.
Step6 = Release
