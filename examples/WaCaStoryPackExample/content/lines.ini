; This pack's murmurs - what the clan says about the loner once he has been (Require = a story variable)
[Murmur.LonerTalk]
Require = SawLoner >= 1
Line1 = That loner smelled of the Thunderpath. I didn't trust him.
Line2 = {LEADER} was kind to let him rest - kinder than I'd have been.

; The pack's own herbalist (S:herbalist in events.ini - Mossfeather) murmurs her own lines: Who = S:<role>
[Murmur.HerbalistTalk]
Who = S:herbalist
Line1 = Mind where you step, {PLAYER} - I've herbs drying on those stones.
Line2 = If you find any marigold out there, bring it to me.

; Dialogue by days: once the herb council has met (HerbCouncil, set by the event), the queens talk of nothing else.
; Who = a role the game has filler lines for (the story check lists them) - not a cat's name.
[Dialogue.QueensOnHerbs]
Who = RiverClanQueen
Require = HerbCouncil >= 1
Line1 = Catmint before the frost - I hope that herbalist knows what she's doing.
Line2 = My kits sneezed all night. Tell Mossfeather we'll need that catmint.
