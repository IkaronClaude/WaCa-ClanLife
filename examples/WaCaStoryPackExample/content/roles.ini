[Role.Herbalist]
Label = Herbs - the medicine den, and the river's edge
Hunt = 0.9
Fish = 1.15
Combat = 0.9
Guard = 1.0

; A second one: the clan's scout - quick on the borders, hard to wound, a little weaker in a long fight. Any story gives
; it with Emit: SetSpecialisation = Scout. Mind Guard: it is the damage your cat TAKES - below 1 is better (0.85 = 15%
; less). A key it doesn't know, or a factor that isn't a number, is named in the log.
[Role.Scout]
Label = Scouting - the borders, and who crosses them
Hunt = 1.05
Guard = 0.85
Combat = 0.95
