; This pack's OWN story (WaCa Clan Life days.lua): its own day counter, next to the main story's (Clan Life's
; config/days.ini). Each calendar day every story is judged on its own Advance; a story whose Advance isn't met repeats
; its day. Its beats play after the main story's in each phase (Morning / Noon / Evening / Night, + Start / After), the
; same keys as days.ini. Needs Clan Life's story days on (config/days.ini [Days] On = 1).
;   Sync = <Name> on a day: a meeting point - this story waits on that day until every story that declares the same
;   Sync is on its own day for it (and ready), then they all go on together. Another pack can join this one's by
;   declaring the same name on one of its days.
[Story]
Name = The herbalist's lessons
Priority = 50

[Day.1]
MorningAfter1 = Card: The herbalist beckons you over. "Smell this. Remember it. You'll need it before leaf-bare."
; Summary: shown if the game's story passes the sync point while this day is skipped
Summary = The herbalist taught you the smell of tansy.

; day 2 holds until you have made up your mind about the loner (the Choice in the loner's visit sets ShelterQuill)
[Day.2]
EveningAfter1 = Card: "A cat who turns strangers away, or one who feeds them?" the herbalist asks. "Herbs care for both."
Advance = If: ShelterQuill > 0
Summary = The loner came and went; the herbalist kept her thoughts on it to herself.

; A sync point with the game's own story: when the game makes your cat a Deputy, the story moves to its day 3 (the day
; with Sync = HerbalistsLessons) - with a warning when the rank-up quest comes, and each skipped day's Summary shown.
[Sync.HerbalistsLessons]
Main = Rank:Deputy
; Warning = the card's own text (else a default)

; day 3: the pack takes the morning's task (Owns + MorningDuty - the herb round from duties.ini)
[Day.3]
Sync = HerbalistsLessons
Goal = Carry the tansy on the herb round - alone
; (Place: the detail panel of the pause menu's quest tab shows it under the story's name - optional)
Place = The herb round
Owns = Morning
MorningDuty = HerbRound
MorningAfter1 = Card: The herbalist hands you a bundle of tansy. "Today you carry it alone."
