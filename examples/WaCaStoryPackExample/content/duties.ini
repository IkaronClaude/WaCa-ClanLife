; This pack's own duty: the herb round - the medicine den, then the fresh-kill pile (a mouse for the herbs' keeper),
; then the herbalist (S:herbalist - whoever plays her) wherever she is. Points are reached in order, each marked on
; screen and on the map (an Interact<n> point is done there with E, your cat playing that pose). A cat point is called by the cat's name; PointName / Card lines may name her as {S:herbalist}.
; Chance: how likely it is given in each third, next to the clan's own duties. Turned in to the medicine cat.
[Duty.HerbRound]
Title = Herb round
Points = Den:Medicine Cat's den; Pile; S:herbalist
PointName1 = The medicine den
PointName2 = The fresh-kill pile
Card1 = The den smells of marigold and old cobweb. The stores are low.
Card2 = You take a mouse from the pile for the herbalist.
Card3 = {S:herbalist} takes the mouse and shows you which leaves to pick tomorrow.
; (show, not tell: at these two points your cat DOES it - the game's Interact prompt there, the pose, then the card)
Interact1 = Sniff
Interact2 = Eat
Chance = Morning:1, Noon:1
MinRank = Apprentice

; (library exercise 2026-11-05: a pack duty done at a place - Interact - and reported to your MENTOR, the role Clan Life
; derives from the game's own text)
[Duty.ScentTrail]
Title = Scent trail
Goal = Find the mouse's trail by the reeds
Points = ReedBank
PointName1 = The reed bank
Interact1 = Sniff
Card1 = Mouse - faint, a little old, heading upstream.
Chance = Noon:1
MinRank = Apprentice

[Task.ScentTrail]
TurnIn = S:mentor

[Task.HerbRound]
TurnIn = MedicineCat
